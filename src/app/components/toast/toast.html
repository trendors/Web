<div class="toast-wrap" *ngIf="(vm$ | async) as msg">
  <div class="toast" [class.success]="$any(msg).type === 'success'" [class.error]="$any(msg).type === 'error'" [class.info]="$any(msg).type === 'info' || !$any(msg).type" role="status">
    <div class="toast-text">{{ $any(msg).text }}</div>
  </div>
</div>
