<div class="detail-panel" *ngIf="invite as inv">
  <button class="close-btn" (click)="close.emit()" aria-label="Close">
    <i class="ti ti-x" aria-hidden="true"></i>
  </button>

  <div class="head">
    <div class="avatar-lg">{{ initials(inv.brand) }}</div>
    <div>
      <h3>{{ inv.campaignTitle }}</h3>
      <p class="sub">{{ inv.brand }} · {{ inv.platform }}</p>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat">
      <div class="num">₦{{ inv.currentOffer }}</div>
      <div class="lbl">current offer</div>
    </div>
    <div class="stat">
      <div class="num">₦{{ inv.escrowHeld }}</div>
      <div class="lbl">held in escrow</div>
    </div>
  </div>

  <div class="thread">
    <div *ngFor="let m of inv.messages" class="msg"
         [class.from-advertiser]="m.from === 'advertiser'"
         [class.from-creator]="m.from === 'creator'">
      <div class="amt">₦{{ m.amount}}</div>
      <div class="note">{{ m.note }}</div>
      <div class="time">{{ m.timestamp }}</div>
    </div>
  </div>

  <app-negotiation></app-negotiation>
