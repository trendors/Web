 <aside class="mini-dashboard">
      @if (user$ | async; as user) {

      <div class="user-header">
        <div class="avatar-small gray">
          {{ user.first_name.slice(0, 1).toUpperCase() || 'U' }}
        </div>
        <div class="user-info">
          <span class="name">{{ user.first_name }} </span>
          <span class="label">{{ user.last_name }}</span>
        </div>
      </div>
      }
      <hr class="divider" />

      <div class="stats-grid">

        <div class="stat-item">
          <span class="stat-value">0</span>
          <span class="stat-label">Shares</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">0</span>
          <span class="stat-label"> Campaigns</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">0</span>
          <span class="stat-label">Claims</span>
        </div>
      </div>

      <button (click)="routeTo('home/profile')" class="btn-profile">View Profile</button>
    </aside>
