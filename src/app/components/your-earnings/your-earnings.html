<div class="earnings">
  <div class="earnings__title">
    <i class="ti ti-coin" aria-hidden="true"></i>
    Your earnings
  </div>

  <div class="earnings__stat">
    <div class="earnings__stat-value">{{ naira(earned()) }}</div>
    <div class="earnings__stat-label">Paid to you</div>
  </div>
  <div class="earnings__stat">
    <div class="earnings__stat-value">{{ naira(coming()) }}</div>
    <div class="earnings__stat-label">On the way</div>
  </div>

  @if (nextCheck()) {
    <p class="earnings__hint">Next bonus decided in {{ nextCheck() }}</p>
  }

  <div class="earnings__divider"></div>

  <button class="earnings__withdraw-btn" [routerLink]="['/home/profile']" [queryParams]="{ tab: 'wallet' }">
    <i class="ti ti-wallet" aria-hidden="true"></i>
    Withdraw
  </button>
</div>
