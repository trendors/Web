<nav class="bottom-nav" aria-label="Primary">
  <a
    class="nav-item"
    routerLink="/home/posts"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <i class="ti ti-home" aria-hidden="true"></i>
    <span class="nav-label">Home</span>
  </a>

  @if (activeProfile() === 'brand') {
    <a class="nav-item" routerLink="/home/view-campaign" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="ti ti-layout-list" aria-hidden="true"></i>
      <span class="nav-label">Campaigns</span>
    </a>
  } @else {
    <a class="nav-item" routerLink="/home/invites-and-applications" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="ti ti-mail" aria-hidden="true"></i>
      <span class="nav-label">Invites</span>
    </a>
  }

  <a
    class="nav-item"
    routerLink="/home/notifications"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <span class="icon-wrap">
      <i class="ti ti-bell" aria-hidden="true"></i>
      @if (unreadCount$ | async; as unreadCount) {
        <span class="counter tabular" [attr.aria-label]="unreadCount + ' unread'">
          {{ unreadCount > 99 ? '99+' : unreadCount }}
        </span>
      }
    </span>
    <span class="nav-label">Alerts</span>
  </a>

  <a class="nav-item" routerLink="/home/profile" routerLinkActive="active" ariaCurrentWhenActive="page">
    <i class="ti ti-user-circle" aria-hidden="true"></i>
    <span class="nav-label">Profile</span>
  </a>
</nav>
