<nav class="topbar">
  <div class="topbar__avatar" role="button" aria-label="User profile">{{ userInitials }}</div>
  <div class="topbar__actions">
    <div class="topbar__earn-pill">
      <i class="ti ti-coin" aria-hidden="true"></i>
      {{ earned }} earned
    </div>

    <button aria-label="Menu" (click)="toggleDrawer()"
      style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;background:transparent;border:1px solid #ccc;border-radius:8px;cursor:pointer;">
      <i class="ti ti-menu-2" style="font-size:20px;"></i>
    </button>
  </div>
</nav>

<div class="drawer-overlay" [class.open]="drawerOpen" (click)="closeDrawer()"></div>

<aside class="drawer" [class.open]="drawerOpen" role="dialog" aria-label="Menu" [attr.aria-hidden]="!drawerOpen">
  <div class="drawer__header">
    <span class="drawer__title">Trendors</span>
    <button class="drawer__close" aria-label="Close menu" (click)="closeDrawer()">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
  </div>

  <div class="drawer__section">
    <p class="drawer__label">Campaign management</p>
    <a class="drawer__item" routerLink="/campaigns" (click)="closeDrawer()">
      <i class="ti ti-search" aria-hidden="true"></i>View campaigns
    </a>
  </div>

  <div class="drawer__section">
    <p class="drawer__label">Influencer hub</p>
    <a class="drawer__item" routerLink="/shares" (click)="closeDrawer()">
      <i class="ti ti-chart-bar" aria-hidden="true"></i>My shares
    </a>
    <a class="drawer__item" routerLink="/transactions" (click)="closeDrawer()">
      <i class="ti ti-receipt" aria-hidden="true"></i>Transactions
    </a>
    <a class="drawer__item drawer__item--highlight" routerLink="/invites" (click)="closeDrawer()">
      <i class="ti ti-mail" aria-hidden="true"></i>Invites and applications

      @if (pendingCount > 0) {
      <span class="drawer__count">{{ pendingCount }}</span>
      }
    </a>
  </div>

  <div class="drawer__section">
    <p class="drawer__label">Account</p>
    <a class="drawer__item" routerLink="/settings" (click)="closeDrawer()">
      <i class="ti ti-settings" aria-hidden="true"></i>Settings
    </a>
    <a class="drawer__item" routerLink="/logout" (click)="closeDrawer()">
      <i class="ti ti-logout" aria-hidden="true"></i>Logout
    </a>
  </div>
</aside>
