<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="error$ | async as error" class="error-message">
        <mat-icon color="warn">error</mat-icon>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="user_name" placeholder="user" />
          <mat-error *ngIf="registerForm.get('user_name')?.hasError('required')"
            >Username is required</mat-error
          >
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="first_name" placeholder="Ex. John" />
            <mat-error *ngIf="registerForm.get('first_name')?.hasError('required')"
              >Required</mat-error
            >
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="last_name" placeholder="Ex. Doe" />
            <mat-error *ngIf="registerForm.get('last_name')?.hasError('required')"
              >Required</mat-error
            >
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="axz@example.com" />
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')"
            >Email is required</mat-error
          >
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')"
            >Invalid email format</mat-error
          >
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone Number (Optional)</mat-label>
          <input matInput formControlName="phone_number" placeholder="1234567890" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
          <button
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword"
            type="button"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')"
            >Password is required</mat-error
          >
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')"
            >Must be at least 6 characters</mat-error
          >
        </mat-form-field>

        <div class="actions">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="registerForm.invalid || (isLoading$ | async)"
          >
            <span *ngIf="!(isLoading$ | async)">Register</span>
            <mat-spinner diameter="20" *ngIf="isLoading$ | async" color="accent"></mat-spinner>
          </button>
        </div>
      </form>
    </mat-card-content>
    <mat-card-footer>
      <p>Already have an account? <a routerLink="/login">Login</a></p>
    </mat-card-footer>
  </mat-card>
</div>
