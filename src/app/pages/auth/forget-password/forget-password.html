<div class="fp-container">
  <mat-card class="fp-card">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <ng-container *ngIf="!emailSent; else sucessTemplate">
        <p class="description">
          Enter your email address and we'll send you a link to reset your password.
        </p>

        <div *ngIf="error$ | async as error" class="error-alert">
          <mat-icon color="warn">error</mat-icon>
          <span>{{ error }}</span>
        </div>

        <form [formGroup]="fpForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="user@example.com" />
            <mat-error *ngIf="fpForm.get('email')?.hasError('required')"
              >Email is required</mat-error
            >
            <mat-error *ngIf="fpForm.get('email')?.hasError('email')">Invalid email</mat-error>
          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="fpForm.invalid || (isLoading$ | async)"
            class="full-width"
          >
            <span *ngIf="!(isLoading$ | async)">Send Reset Link</span>
            <mat-spinner diameter="20" *ngIf="isLoading$ | async" color="accent"></mat-spinner>
          </button>
        </form>
      </ng-container>

      <ng-template #sucessTemplate>
        <div class="sucess-content">
          <mat-icon class="success-icon">check_circle</mat-icon>
          <h3>Link Sent!</h3>
          <p class="description">Check your inbox (or console) for the reset link.</p>
          <button mat-stroked-button color="primary" routerLink="/reset-password">
            Go to Reset Page (Manual)
          </button>
        </div>
      </ng-template>
    </mat-card-content>
    <mat-card-footer>
      <a routerLink="/login">Back to Login</a>
    </mat-card-footer>
  </mat-card>
</div>
