<div class="metrics-page">

  <main class="main-container">

    <button
      type="button"
      class="back-button"
      (click)="goBack()"
    >
      <span class="back-icon">←</span>
      <span>Back to influencers</span>
    </button>

  


    <section class="profile-card">
    <!-- <img [src]="profile.user.avatar" [alt]="profile.user.first_name + ' ' + profile.user.last_name" class="avatar" /> -->

      <div class="profile-details">

        <div class="name-row">

          <h1>
            {{ influencerDisplayName }}
          </h1>

          <!-- @if (profile.status) {
            <span class="status-badge" [class]="profile.status.toLowerCase()">
              <span class="status-dot"></span>
              {{ profile.status }}
            </span>
          } -->

        </div>

        <!-- <p class="subtitle">
          {{ profile?.user?.username }}
          @if (profile.campaign) {
            <span>·</span>
            {{ profile.campaign }}
          }
        </p> -->

        <!-- Total Followers -->
        @if (followersLabel) {
        <div class="total-followers">
          <span class="followers-label">Total Followers</span>
          <span class="followers-value">{{ followersLabel }}</span>
        </div>
        }

      </div>

    </section>


    @if (loadError) {
      <p class="list-state list-state--error">{{ loadError }}</p>
    }

    <!-- @if (assignmentLoaded) { -->
    <app-negotiation
      id="negotiation"
      [influencerName]="influencerDisplayName"
      [dealStatus]="profile?.status"
      [offerAmount]="profile?.totalPayout"
      [viewMode]="viewMode"
      [campaignId]="campaignId"
      [campaignInfluencerId]="campaignInfluencerId"
      [influencerId]="influencerId">
      </app-negotiation>
    
  </main>
</div>
