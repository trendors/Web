<div class="home-container">


  <div class="card" *ngIf="post$ | async as post">
    <div class="post-header">
      <div class="post-author">
        <div class="avatar-small">{{ (post.user?.first_name || post.userName || '').slice(0,1).toUpperCase() }}</div>
        <div class="user-info">
          <span class="name">{{ post.user?.first_name || post.userName || 'Unknown' }}</span>
          <span class="sub-text">{{ post.createdAt | date:'short' }}</span>
        </div>
      </div>
    </div>

    <div class="post-content">
      <p>{{ post.text }}</p>

      <div class="image-gallery" *ngIf="post.images && post.images.length > 0">
        <div class="img-wrapper" *ngFor="let img of post.images">
          <img [src]="img" alt="Post image" />
        </div>
      </div>
    </div>

    <div class="post-actions">
      <button class="action-btn" (click)="onLike(post.id)">
        <span>❤️</span> {{ post.likes?.length || 0 }} Likes
      </button>
      <button class="action-btn">
        <span>💬</span> {{ post.comments?.length || 0 }} Comments
      </button>
      <div class="spacer"></div>
      <button class="action-btn" (click)="openShareMenu(post)">
        <span>🔗</span> Share
      </button>
    </div>
  </div>

   <aside class="sidebar right">
    <aside class="mini-dashboard">
      <div class="user-header">
        <div class="avatar-small">JD</div>
        <div class="user-info">
          <span class="name">Jane Doe</span>
          <span class="label">Pro Member</span>
        </div>
      </div>

      <hr class="divider" />

      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-value">124</span>
          <span class="stat-label">Shares</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">1.2k</span>
          <span class="stat-label">Viewers</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">1.2k</span>
          <span class="stat-label">Viewers</span>
        </div>
      </div>

      <button class="btn-profile">View Profile</button>
    </aside>
  </aside>

</div>
