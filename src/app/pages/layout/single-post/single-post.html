<div class="page" *ngIf="post$ | async as post">

  <header class="masthead">
    <div class="masthead__mark">CAMPAIGN&nbsp;DESK</div>
    <div class="masthead__meta" id="masthead-meta">Dispatch No. 001</div>
  </header>

  <main class="sheet">

    <!-- HERO -->
    <section class="hero">
      <div class="hero__eyebrow-row">
        <span class="pill" id="status-pill">Live</span>
        <span class="eyebrow" id="category">Campaign Category</span>
      </div>
      <h1 class="hero__title" id="title">{{post.heading}}</h1>
      <p class="hero__subtitle" id="subtitle">{{post.text}}</p>

      <div class="hero__figure" id="hero-image-wrap">
        <div class="hero__figure-placeholder" id="hero-image-placeholder" *ngFor="let img of post.images">
          <img id="hero-image" [src]="img" alt="Post image" />

        </div>
      </div>
    </section>

    <!-- STATS STRIP -->
    <section class="stats" id="stats" aria-label="Campaign metrics"></section>

  </main>

  <footer class="foot">
    <span id="foot-org">Organization Name</span>
    <span class="foot__dot">&middot;</span>
    <span id="foot-updated">Updated recently</span>
  </footer>

  <!-- Sticky mobile CTA -->
  <div class="mobile-bar" id="mobile-bar">
    <a class="cta cta--mobile" id="cta-button-mobile" [href]="post?.link" target="_blank" rel="noopener">
      <span id="cta-text-mobile">Take action</span>
    </a>
  </div>
</div>
