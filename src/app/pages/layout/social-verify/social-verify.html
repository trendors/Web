<div class="card social-card">
  <div class="section-label">Connected Accounts for {{ displayName(user$ | async) }}</div>
  <div class="platform-list">

    <div class="platform-item">
      <div class="platform-left">
        <div class="platform-icon twitter-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622z" />
          </svg>
        </div>
        <div class="platform-meta">
          <div class="platform-name-row">
            @if((user$ | async)?.twitter_handle) {
            <span class="status-chip connected-chip">Connected</span>

            } @else {
            <span class="status-chip pending-chip">Not Connected</span>

            }

          </div>
          @if ((user$ | async)?.twitter_handle; as handle) {
          <span class="platform-handle">@{{ handle }}</span>
          }
        </div>
      </div>
      <div class="platform-right">
        @if(!(user$ | async)?.twitter_handle) {
        <button class="btn-connect" (click)="openTwitter()" type="button">Connect</button>
        }
      </div>
    </div>

    <div class="item-divider"></div>

    <div class="platform-item">
      <div class="platform-left">
        <div class="platform-icon instagram-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path
              d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />
          </svg>
        </div>
        <div class="platform-meta">
          <div class="platform-name-row">
            <span class="status-chip pending-chip">Coming soon</span>
          </div>
        </div>
      </div>
      <div class="platform-right">


        <button class="btn-connect" type="button" disabled>Connect</button>
      </div>
    </div>

    <div class="item-divider"></div>

    <div class="platform-item">
      <div class="platform-left">
        <div class="platform-icon tiktok-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path
              d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z" />
          </svg>
        </div>
        <div class="platform-meta">
          <div class="platform-name-row">
            <span class="status-chip pending-chip">Coming soon</span>
          </div>
        </div>
      </div>
      <div class="platform-right">
        <button class="btn-connect" type="button" disabled>Connect</button>
      </div>
    </div>


  </div>
</div>
