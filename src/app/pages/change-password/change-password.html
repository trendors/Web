<div class="cp-container">
  <mat-card class="cp-card">
    <mat-card-header>
      <mat-card-title>Change Password</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (error$ | async; as error) {
        <div class="error-alert">
          <mat-icon color="warn">error</mat-icon>
          <span>{{ error }}</span>
        </div>
      }
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Current Password</mat-label>
          <input matInput [type]="hideOld ? 'password' : 'text'" formControlName="oldPassword" />
          <button mat-icon-button matSuffix (click)="hideOld = !hideOld" type="button">
            <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('oldPassword')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="newPassword" />
          <button mat-icon-button matSuffix (click)="hideNew = !hideNew" type="button">
            <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">Min 6 chars</mat-error>
        </mat-form-field>

        <div class="actions">
          <button
            mat-flat-button
            color="primary"
            class="full-width"
            type="submit"
            [disabled]="form.invalid || (isLoading$ | async)"
          >
            <span *ngIf="!(isLoading$ | async)">Update Password</span>
            <mat-spinner diameter="20" *ngIf="isLoading$ | async" color="accent"></mat-spinner>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
